name: Release agent-harness

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: prepare-release
    if: needs.prepare-release.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rid: osx-arm64
          # Self-contained .NET publishing bundles the selected runtime host,
          # so Apple Silicon can produce the Intel macOS distribution too.
          - os: macos-14
            rid: osx-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/AgentHarness/AgentHarness.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false --output artifacts/${{ matrix.rid }}
      - if: runner.os != 'Windows'
        run: cd artifacts/${{ matrix.rid }} && zip ../../agent-harness-${{ matrix.rid }}.zip agent-harness
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path artifacts/${{ matrix.rid }}/agent-harness.exe -DestinationPath agent-harness-${{ matrix.rid }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: agent-harness-${{ matrix.rid }}
          path: agent-harness-${{ matrix.rid }}.zip
  release:
    needs: [prepare-release, publish]
    if: needs.prepare-release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - run: cd release-assets && sha256sum agent-harness-*.zip > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
