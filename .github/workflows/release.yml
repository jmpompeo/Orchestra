name: Release agent-harness

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing v* release tag whose assets should be rebuilt.
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  prepare-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          token: ${{ secrets.GITHUB_TOKEN }}

  validate-recovery:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          case "$TAG_NAME" in
            v[0-9]*) ;;
            *) echo "tag_name must begin with v followed by a version number." >&2; exit 1 ;;
          esac
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

  publish:
    needs: [prepare-release, validate-recovery]
    if: >-
      ${{ always() && ((github.event_name == 'workflow_dispatch' &&
      needs.validate-recovery.result == 'success') ||
      needs.prepare-release.outputs.release_created == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rid: osx-arm64
          # Self-contained .NET publishing bundles the selected runtime host,
          # so Apple Silicon can produce the Intel macOS distribution too.
          - os: macos-14
            rid: osx-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'workflow_dispatch' &&
            needs.validate-recovery.outputs.tag_name || needs.prepare-release.outputs.tag_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/AgentHarness/AgentHarness.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false --output artifacts/${{ matrix.rid }}
      - if: runner.os != 'Windows'
        run: cd artifacts/${{ matrix.rid }} && zip ../../agent-harness-${{ matrix.rid }}.zip agent-harness
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path artifacts/${{ matrix.rid }}/agent-harness.exe -DestinationPath agent-harness-${{ matrix.rid }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: agent-harness-${{ matrix.rid }}
          path: agent-harness-${{ matrix.rid }}.zip
  release:
    needs: [prepare-release, validate-recovery, publish]
    if: >-
      ${{ always() && ((github.event_name == 'workflow_dispatch' &&
      needs.validate-recovery.result == 'success') ||
      needs.prepare-release.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - run: cd release-assets && sha256sum agent-harness-*.zip > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: >-
            ${{ github.event_name == 'workflow_dispatch' &&
            needs.validate-recovery.outputs.tag_name || needs.prepare-release.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
